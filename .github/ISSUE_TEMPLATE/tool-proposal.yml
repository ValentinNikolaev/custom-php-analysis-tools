name: Propose a tool
description: Suggest a PHP static-analysis or code-quality tool for the catalog.
title: "[Tool]: "
body:
  - type: markdown
    attributes:
      value: |
        Propose an actively maintained tool that is relevant to PHP analysis, quality, architecture, metrics, refactoring, or related workflows.
  - type: input
    id: name
    attributes:
      label: Tool name
      placeholder: Example Analyzer
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Source repository
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Official website or documentation
      description: Leave empty if the source repository is the official project page.
      placeholder: https://example.org
  - type: input
    id: package
    attributes:
      label: Packagist package
      placeholder: https://packagist.org/packages/vendor/package
  - type: dropdown
    id: category
    attributes:
      label: Suggested category
      options:
        - Bug finders
        - Coding standards
        - Architecture rules
        - Libraries and building blocks
        - Fixers and refactoring
        - Metrics and architecture
        - Hosted analysis services
        - Specialized tools
    validations:
      required: true
  - type: dropdown
    id: artifact-type
    attributes:
      label: Artifact type
      options:
        - Standalone analyzer or linter
        - Analyzer extension or ruleset
        - Formatter, fixer, or refactoring tool
        - Library or building block
        - Orchestrator or CI workflow tool
        - Hosted service
        - Adjacent testing or coverage tool
    validations:
      required: true
  - type: textarea
    id: use-cases
    attributes:
      label: Use cases and ecosystems
      description: List the concrete tasks it solves and any PHP framework or analyzer ecosystem it extends.
      placeholder: "Use cases: dead code, deprecated APIs. Ecosystems: PHPStan, Symfony."
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: What the tool does
      description: Briefly explain its purpose and why it belongs in this catalog.
    validations:
      required: true
  - type: textarea
    id: maintenance
    attributes:
      label: Maintenance evidence
      description: Link to a recent release, commit, or other evidence that the project is active.
    validations:
      required: true
  - type: textarea
    id: license-pricing
    attributes:
      label: License, pricing, and delivery
      description: State the source license and whether the tool is local, self-hosted, free, or paid.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Closest catalog alternatives
      description: Explain what is distinct from tools already listed. Popularity alone is not sufficient.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the published catalog, candidates, issues, and pull requests for this tool.
          required: true
        - label: I am not requesting Editors' Choice placement.
          required: true
        - label: I disclosed any affiliation with this tool below.
          required: true
  - type: textarea
    id: affiliation
    attributes:
      label: Affiliation
      description: State your relationship to the project, or write "None."
    validations:
      required: true
