name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_call:
    inputs:
      deploy:
        description: Deploy the generated site after a successful build
        required: false
        type: boolean
        default: true
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run catalog and site tests
        run: |
          python scripts/validate_catalog.py
          python -m unittest discover -s tests

      - name: Configure GitHub Pages
        if: github.event_name != 'workflow_call' || inputs.deploy
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build the production site
        run: python scripts/generate_site.py --output site-dist

      - name: Upload the Pages artifact
        if: github.event_name != 'workflow_call' || inputs.deploy
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site-dist

  deploy:
    needs: build
    if: github.event_name != 'workflow_call' || inputs.deploy
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
