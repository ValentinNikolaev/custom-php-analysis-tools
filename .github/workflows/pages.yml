name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_call:
    inputs:
      deploy:
        description: Deploy the generated site after a successful build
        required: false
        type: boolean
        default: true
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run catalog and site tests
        run: python -m unittest discover -s tests

      - name: Configure GitHub Pages
        if: github.event_name != 'workflow_call' || inputs.deploy
        uses: actions/configure-pages@v5

      - name: Build the production site
        run: python scripts/generate_site.py --output site-dist

      - name: Upload the Pages artifact
        if: github.event_name != 'workflow_call' || inputs.deploy
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

  deploy:
    needs: build
    if: github.event_name != 'workflow_call' || inputs.deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
