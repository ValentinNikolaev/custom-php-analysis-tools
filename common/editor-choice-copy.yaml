# Human-reviewed editorial copy. Selection is intentionally use-case driven,
# not a fixed quota per category or a ranking derived from GitHub stars.
recommended_for:
  php-stan: "PHP applications that need configurable type-safety checks and a broad extension ecosystem"
  psalm: "Projects needing advanced type modelling, taint analysis, and security checks"
  phpcsstandards-php-codesniffer: "Teams enforcing published PHP standards or detailed project-specific coding rules"
  php-cs-fixer: "Projects that want automatic formatting and coding-standard fixes"
  rector: "Teams automating PHP upgrades, framework migrations, or repeatable refactoring"
  deptrac: "Layered applications and modular monoliths that enforce dependency boundaries in CI"
  php-parser: "Developers building analyzers, refactoring tools, formatters, or source transformations"
  semgrep: "Security teams writing custom checks for PHP and polyglot repositories"
  laravel-pint: "Laravel projects that want a low-configuration, framework-oriented formatter"
why_it_stands_out:
  php-stan: "Rule levels, baselines, and framework extensions support both gradual adoption and deep type analysis."
  psalm: "An expressive type system and taint engine cover correctness and application-security problems."
  phpcsstandards-php-codesniffer: "Its extensible sniff API supports mature community standards and precise custom rules."
  php-cs-fixer: "A broad fixer catalog and custom rule sets make formatting changes deterministic and automatable."
  rector: "AST-based rules turn upgrades and refactoring recipes into reviewable project-wide code changes."
  deptrac: "Dependency rules convert intended architecture boundaries into repeatable CI checks."
  php-parser: "A mature AST, traversal API, and code builder underpin many PHP analysis and transformation tools."
  semgrep: "Source-like patterns make custom bug and security checks accessible across multiple languages."
  laravel-pint: "Laravel-maintained presets deliver practical PHP-CS-Fixer defaults with very little setup."
