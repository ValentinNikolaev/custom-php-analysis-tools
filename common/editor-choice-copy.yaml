# Hand-written or LLM-assisted editorial copy only. Run a stop-slop pass before committing changes.
# Do not derive these fields from stars, activity dates, descriptions, or ranking scores.
# Describe the user's use case in recommended_for; do not repeat the tool name shown in the first column.
recommended_for:
  php-stan: "PHP applications that need configurable type-safety checks and framework extensions"
  jscpd: "Polyglot repositories that need duplicate-code checks across PHP and other file formats"
  psalm: "Projects needing advanced type modelling, taint analysis, and security checks"
  phan: "Teams that want AST-based PHP analysis designed to limit false positives"
  php-inspection: "Developers who want broad PHP correctness and maintainability checks inside JetBrains IDEs"
  mago: "Teams that want a Rust-based PHP linter, formatter, and static analyzer"
  php-mess-detector: "Finding complexity, naming, unused-code, and design problems with configurable rules"
  php-compatibility: "Libraries and applications that must support specific PHP version ranges"
  composer-dependency-analyser: "Composer projects checking for unused, shadow, and misplaced dependencies"
  skylos: "Local pull-request checks for dead code, secrets, security defects, and quality regressions"
  easycodingstandard: "Teams running PHP-CS-Fixer and PHP_CodeSniffer through one configuration"
  phpcsstandards-php-codesniffer: "Projects enforcing published standards or detailed custom coding rules"
  deptrac: "Layered applications and modular monoliths that enforce dependency boundaries in CI"
  php-architecture-tester: "Teams that prefer to express architecture constraints as readable PHP tests"
  php-parser: "Developers building analyzers, refactoring tools, formatters, or source transformations"
  php-cs-fixer: "Projects that automatically apply PHP formatting and coding-standard fixes"
  rector: "Teams automating PHP upgrades, framework migrations, or repeatable refactoring"
  phpinsights: "Teams that want a quick command-line overview of PHP code quality"
  php-metrics: "Visual review of complexity, coupling, maintainability, and project structure"
  pdepend: "Detailed object-oriented design, dependency, complexity, and maintainability metrics"
  phpcodearcheology: "Architecture review using code metrics, dependency graphs, and Git churn"
  semgrep: "Security teams writing custom checks for PHP and polyglot repositories"
  larastan: "Laravel applications that need PHPStan to understand framework conventions"
why_it_stands_out:
  php-stan: "Extensions add framework-specific types, while baselines and rule levels support gradual adoption."
  jscpd: "One CLI detects copy-paste across 223 formats and provides CI, token-efficient, and MCP reporting options."
  psalm: "Psalm combines an expressive type system with taint analysis for application and security defects."
  phan: "Phan uses php-ast and tries to prove incorrectness, an approach designed to reduce false positives."
  php-inspection: "The plugin adds configurable inspections and quick fixes directly to PhpStorm and IntelliJ IDEA Ultimate."
  mago: "Mago combines customizable linting, static analysis, automatic fixes, formatting, and AST visualization."
  php-mess-detector: "PHPMD turns PDepend metrics into configurable rules for complexity, naming, and maintainability problems."
  php-compatibility: "Dedicated PHP_CodeSniffer rules detect syntax and API usage that conflicts with a target PHP version."
  composer-dependency-analyser: "Separate checks identify unused, shadow, and misplaced Composer dependencies."
  skylos: "The local-first scanner checks pull requests for dead code, secrets, security defects, and quality regressions."
  easycodingstandard: "One PHP config runs both rule engines in parallel and supports prepared rule sets and gradual adoption."
  phpcsstandards-php-codesniffer: "An extensible sniff API supports established standards and project-specific rules."
  deptrac: "Dependency rules turn layer and module boundaries into repeatable CI checks."
  php-architecture-tester: "A fluent PHP API keeps architecture tests in the same language and workflow as application tests."
  php-parser: "A stable AST, traversal API, and code builder support many PHP analyzers and transformation tools."
  php-cs-fixer: "A broad fixer catalog and custom rule sets cover published standards and project-specific formatting."
  rector: "AST-based rules turn upgrade and refactoring recipes into reviewable code changes across a project."
  phpinsights: "A single console report summarizes several code-quality signals and can enforce thresholds in CI."
  php-metrics: "Browsable reports make complexity, coupling, and architecture metrics easier to inspect than raw output."
  pdepend: "JDepend-inspired metrics quantify coupling, complexity, dependencies, and maintainability."
  phpcodearcheology: "One analyzer combines 60+ metrics, dependency graphs, Git churn hotspots, and an MCP server."
  semgrep: "Source-like rules make custom bug and security checks quicker to write than compiler-style analyzers."
  larastan: "Laravel-specific type information covers containers, facades, Eloquent, and other framework conventions."
